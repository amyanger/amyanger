name: Metrics
on:
  schedule: [{cron: "0 4 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"], paths: [".github/workflows/metrics.yml"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: amyanger
          filename: metrics.svg
          template: classic
          base: header
          config_timezone: Europe/London
          config_octicon: yes
          retries: 3
          retries_delay: 300
          commits_authoring: arjun-myanger, amyanger, 57688398+amyanger@users.noreply.github.com

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, makefile, cmake, shell, dockerfile, batchfile
          plugin_languages_skipped: pokeheartgold

          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request
