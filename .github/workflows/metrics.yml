name: Metrics
on:
  schedule: [{cron: "0 4 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"], paths: [".github/workflows/metrics.yml"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to the v3.34 commit (the project has had no release since 2023-09),
      # and the image is built from that commit instead of pulling a movable registry tag.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: no
          user: amyanger
          filename: metrics.svg
          template: classic
          base: header
          config_timezone: Europe/London
          config_octicon: yes
          retries: 3
          retries_delay: 300
          commits_authoring: arjun-myanger, amyanger, 57688398+amyanger@users.noreply.github.com

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_indepth: yes
          # recently-used crashes since GitHub dropped commit lists from push events (2025)
          plugin_languages_sections: most-used
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, makefile, cmake, shell, dockerfile, batchfile
          plugin_languages_skipped: pokeheartgold

          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request
