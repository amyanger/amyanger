name: Metrics
on:
  schedule: [{cron: "0 4 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"], paths: [".github/workflows/metrics.yml"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The project's 2023 Dockerfile no longer builds, so pull the published v3.34
      # image by digest and give it the local name the action looks for; with
      # use_prebuilt_image off, the action then uses it instead of a movable tag.
      - name: Pull pinned metrics image
        run: |
          docker pull ghcr.io/lowlighter/metrics@sha256:257392f90340f916cb8b815026f259399f6b246d3eb7de38b58bfe7a07bd5b65
          docker tag ghcr.io/lowlighter/metrics@sha256:257392f90340f916cb8b815026f259399f6b246d3eb7de38b58bfe7a07bd5b65 metrics:3.34.0
      # Pinned to the v3.34 commit (no release since 2023-09).
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: no
          user: amyanger
          filename: metrics.svg
          template: classic
          base: header
          config_timezone: Europe/London
          config_octicon: yes
          retries: 3
          retries_delay: 300
          commits_authoring: arjun-myanger, amyanger, 57688398+amyanger@users.noreply.github.com

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_indepth: yes
          # recently-used crashes since GitHub dropped commit lists from push events (2025)
          plugin_languages_sections: most-used
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, makefile, cmake, shell, dockerfile, batchfile
          plugin_languages_skipped: pokeheartgold

          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request
